name: Build Mod (iOS)

on:
  workflow_run:
    workflows: ["Extract Source Zip"]
    types: [completed]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Unzip source (fallback)
        if: ${{ !cancelled() && success() }}
        run: |
          if [ ! -f "CMakeLists.txt" ]; then
            unzip -o noclip-safe-source.zip -d .
          fi

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          build-config: 'Release'
          target: iOS
          # Si le build iOS échoue à cause d'un SDK trop ancien, décommente :
          # sdk: 'nightly'

      - name: Upload the built .geode
        uses: actions/upload-artifact@v4
        with:
          name: SafeNoclip-iOS
          path: |
            **/*.geode
